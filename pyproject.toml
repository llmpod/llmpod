[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmpod"
# 与 llmpod/__init__.py 的 __version__ 保持一致（运行时读后者；发版用
# make bump-version V=x.y.z 一条命令同步两处 + 刷新 uv.lock）
version = "26.10.21"
description = "AI Inference Gateway Platform"
license = "AGPL-3.0-only"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "python-multipart>=0.0.18",  # multipart 文件上传（POST /admin/models/upload）
    "uvicorn[standard]>=0.30.0",
    # ORM + DB
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Security
    "bcrypt>=4.0.0",
    # Logging
    "loguru>=0.7.0",
    # HTTP client
    "httpx>=0.27.0",
    # WebSocket
    "websockets>=14.0",
    # Metrics（管道埋点 + Prometheus 文本格式 + scraper 解析共用）
    "prometheus-client>=0.21.0",
    # DB schema 版本化迁移（scripts/init_db.py 启动时 upgrade head）
    "alembic>=1.13",
]

[project.optional-dependencies]
node = [
    "pynvml>=11.0.0",
    "psutil>=6.0.0",
    "docker>=7.0.0",
    "aiosqlite>=0.20.0",  # Node 本地任务持久化（local_tasks；重启恢复）
    "huggingface_hub>=0.25.0,<2.0",  # Node HF 自动下载（M4a：hf_hub_download 逐文件拉取）；<2.0 锁主版本 API
]
proxy = [
    # API 网关协议层测试契约：官方 SDK（自定义 base_url 指向引擎 OpenAI 兼容/Anthropic 兼容端点）
    "openai>=1.0.0",
    "anthropic>=0.40.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llmpod"]

[tool.ruff]
line-length = 120
target-version = "py312"
# worktrees 是隔离分支的工作副本，不属于主仓 lint 范围；排除避免重复报错
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint.per-file-ignores]
# permissions.py 是权限常量重导出 facade：所有 import 均为对外公开 API
# （外部 `from llmpod.permission.permissions import CLUSTER_READ` 等既有用法），
# 本地不引用属设计意图，F401 在此为误报。
"llmpod/permission/permissions.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
