<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <title>LLMPod</title>
    <style>
      /* 首屏 splash:覆盖 JS 加载 + 路由守卫等待 profile/hasAnyCluster 期间的白屏,app 挂载后由 Vue 整体替换 #app 内容自动移除 */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f6;
        animation: app-splash-in 0.3s ease;
      }
      .app-splash__logo {
        width: 96px;
        height: 96px;
        animation: app-splash-pop 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .app-splash__logo svg {
        display: block;
      }
      /* shine 扫光条:SVG 内 clipPath 裁成图标形状,只扫过图标本体 */
      .app-splash__shine {
        transform: translateX(0) skewX(-20deg);
        animation: app-splash-shine 1.6s ease-in-out infinite;
      }
      @keyframes app-splash-in {
        from {
          opacity: 0;
        }
      }
      @keyframes app-splash-pop {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @keyframes app-splash-shine {
        0% {
          transform: translateX(0) skewX(-20deg);
        }
        60%,
        100% {
          transform: translateX(560px) skewX(-20deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .app-splash {
          background: #13131a;
        }
      }
    </style>
  </head>
