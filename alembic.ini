# Alembic 配置：迁移脚本目录与运行时参数。
#
# 数据库连接串不在这里写死——env.py 直接读 llmpod 的 Settings
# （LLMPOD_PG_* 环境变量），保持与主应用同一配置来源。
# 常用命令（或用 Makefile 等价目标 db-migrate / db-revision）：
#   uv run alembic upgrade head                          # 升级到最新
#   uv run alembic revision --autogenerate -m "add xxx"  # 按模型变更生成迁移
#   uv run alembic history                               # 查看迁移链

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
# 迁移文件名带可读后缀；版本号本身用随机字符串，不用自增序号
# （多分支/多机生成不冲突）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
